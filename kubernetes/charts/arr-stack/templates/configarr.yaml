{{- if .Values.configarr.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: configarr-secrets
  labels:
    app.kubernetes.io/name: configarr
    {{- include "arr-stack.labels" . | nindent 4 }}
type: Opaque
stringData:
  secrets_yml: |
    SONARR_URL: "http://sonarr:8989"
    RADARR_URL: "http://radarr:7878"
    {{- range $key, $value := .Values.configarr.env }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: configarr-config
  labels:
    app.kubernetes.io/name: configarr
    {{- include "arr-stack.labels" . | nindent 4 }}
data:
  config.yml: |
    {{- .Files.Get "files/configarr/config.yml" | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: configarr-custom-formats
  labels:
    app.kubernetes.io/name: configarr
    {{- include "arr-stack.labels" . | nindent 4 }}
data:
  {{- range $path, $_ := .Files.Glob "files/configarr/custom-formats/*.json" }}
  {{ base $path }}: |
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: configarr-sync
  labels:
    app.kubernetes.io/name: configarr
    {{- include "arr-stack.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.configarr.schedule | quote }}
  timeZone: {{ .Values.timezone | quote }}
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: configarr
            {{- include "arr-stack.labels" . | nindent 12 }}
        spec:
          restartPolicy: Never
          containers:
            - name: configarr
              image: ghcr.io/raydak-labs/configarr:latest
              env:
                - name: TZ
                  value: {{ .Values.timezone | quote }}
              volumeMounts:
                - name: repos
                  mountPath: /app/repos
                - name: config
                  mountPath: /app/config/config.yml
                  subPath: config.yml
                - name: secrets
                  mountPath: /app/config/secrets.yml
                  subPath: secrets_yml
                - name: custom-formats
                  mountPath: /config/custom_formats
                  readOnly: true
          volumes:
            - name: repos
              hostPath:
                path: {{ .Values.configsRoot }}/configarr
                type: DirectoryOrCreate
            - name: config
              configMap:
                name: configarr-config
            - name: secrets
              secret:
                secretName: configarr-secrets
            - name: custom-formats
              configMap:
                name: configarr-custom-formats
{{- end }}

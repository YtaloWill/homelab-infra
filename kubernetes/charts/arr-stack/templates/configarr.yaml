{{- if .Values.configarr.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: configarr-secrets
  labels:
    app.kubernetes.io/name: configarr
    {{- include "arr-stack.labels" . | nindent 4 }}
type: Opaque
stringData:
  secrets_yml: |
    SONARR_URL: "http://sonarr:8989"
    RADARR_URL: "http://radarr:7878"
    {{- range $key, $value := .Values.configarr.env }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: configarr-config
  labels:
    app.kubernetes.io/name: configarr
    {{- include "arr-stack.labels" . | nindent 4 }}
data:
  config.yml: |
    {{- .Files.Get "files/configarr/config.yml" | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: configarr-custom-formats
  labels:
    app.kubernetes.io/name: configarr
    {{- include "arr-stack.labels" . | nindent 4 }}
data:
  {{- range $path, $_ := .Files.Glob "files/configarr/custom-formats/*.json" }}
  {{ base $path }}: |
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
---
# One-shot sync Job. The name carries configarr.syncTrigger (ansible:
# configarr_sync_trigger in inventory/group_vars/all/main.yml): the first
# time configarr.enabled goes true, configarr-sync-1 is a new object name,
# so helm upgrade --install creates and runs it as part of that deploy —
# this is what seeds the profiles automatically. A resync is triggered by
# bumping configarr_sync_trigger to a new value and re-applying, which gives
# Helm a fresh object name to create.
apiVersion: batch/v1
kind: Job
metadata:
  name: configarr-sync-{{ .Values.configarr.syncTrigger }}
  labels:
    app.kubernetes.io/name: configarr
    {{- include "arr-stack.labels" . | nindent 4 }}
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: configarr
        {{- include "arr-stack.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
        - name: configarr
          image: ghcr.io/raydak-labs/configarr:latest
          env:
            - name: TZ
              value: {{ .Values.timezone | quote }}
          volumeMounts:
            - name: repos
              mountPath: /app/repos
            - name: config
              mountPath: /app/config/config.yml
              subPath: config.yml
            - name: secrets
              mountPath: /app/config/secrets.yml
              subPath: secrets_yml
            - name: custom-formats
              mountPath: /config/custom_formats
              readOnly: true
      volumes:
        - name: repos
          hostPath:
            path: {{ .Values.configsRoot }}/configarr
            type: DirectoryOrCreate
        - name: config
          configMap:
            name: configarr-config
        - name: secrets
          secret:
            secretName: configarr-secrets
        - name: custom-formats
          configMap:
            name: configarr-custom-formats
{{- end }}

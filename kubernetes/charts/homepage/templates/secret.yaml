apiVersion: v1
kind: Secret
metadata:
  name: homepage-secret
  labels:
    app.kubernetes.io/name: homepage
    {{- include "homepage.labels" . | nindent 4 }}
type: Opaque
stringData:
  # API keys — sourced from vault_api_keys via the Ansible role template
  # (Requirement 12.5, design decision 14).
  {{- range $key, $value := .Values.apiKeys }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  # qBittorrent credentials — sourced from vault_qbittorrent_credentials
  # (Requirement 12.5).
  HOMEPAGE_VAR_QBITTORRENT_USERNAME: {{ .Values.qbittorrentCredentials.username | quote }}
  HOMEPAGE_VAR_QBITTORRENT_PASSWORD: {{ .Values.qbittorrentCredentials.password | quote }}

---
- name: Check the share is available
  ansible.builtin.stat:
    path: "{{ configs_root }}/jellyfin"
  register: jf_share

- name: Abort when the share is not mounted
  ansible.builtin.assert:
    that: jf_share.stat.exists
    fail_msg: >-
      {{ configs_root }}/jellyfin missing — run storage.yml first
      (samba + host CIFS mount), then restart this container.

# Config/data persist on the share (requirement 5.2); the chart's cache
# volume is an emptyDir on the node's own local disk.
- name: Config/data dirs on the share
  ansible.builtin.file:
    path: "{{ configs_root }}/jellyfin/{{ item }}"
    state: directory
    mode: "0770"
  loop: [config, data]

- name: Stack directory
  ansible.builtin.file:
    path: "{{ jellyfin_stack_dir }}"
    state: directory
    mode: "0755"

- name: Copy the Helm chart to the container
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../kubernetes/charts/jellyfin/"
    dest: "{{ jellyfin_stack_dir }}/chart/"

- name: Render values
  ansible.builtin.template:
    src: values-homelab.yaml.j2
    dest: "{{ jellyfin_stack_dir }}/values.yaml"
    mode: "0644"

# helm upgrade --install is idempotent; k8s reconciles the rest. Change
# reporting is delegated to helm's own release history.
- name: Deploy the jellyfin release
  ansible.builtin.command:
    cmd: >-
      helm upgrade --install jellyfin {{ jellyfin_stack_dir }}/chart
      -f {{ jellyfin_stack_dir }}/values.yaml
      --namespace jellyfin --create-namespace
      --wait --timeout 5m
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

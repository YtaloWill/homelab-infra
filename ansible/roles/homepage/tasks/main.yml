---
- name: Check the share is available
  ansible.builtin.stat:
    path: "{{ configs_root }}/homepage"
  register: hp_share

- name: Abort when the share is not mounted
  ansible.builtin.assert:
    that: hp_share.stat.exists
    fail_msg: >-
      {{ configs_root }}/homepage missing — run storage.yml first
      (samba + host CIFS mount), then restart this container.

# Homepage's own first-run behaviour is to copy every file in its own
# src/skeleton/ into /app/config whenever missing (verified against
# gethomepage/homepage upstream: bookmarks.yaml, custom.css, custom.js,
# docker.yaml, kubernetes.yaml, proxmox.yaml, services.yaml, settings.yaml,
# widgets.yaml — services.yaml is excluded here, it's provided by the
# chart's ConfigMap instead). That copy tries to set file metadata CIFS
# won't allow (same class of failure as the chown warning below), and it
# isn't tolerated: EPERM there crashes the container, one file at a time as
# each is reached. Seeding all of them ourselves (as root, which the CIFS
# mount's uid mapping already permits) means Homepage finds every one
# already present and never attempts its own copy. force: false — only
# writes when absent, so it won't clobber anything changed later via
# Homepage's own UI.
- name: Seed default config files Homepage would otherwise try to copy itself
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ configs_root }}/homepage/{{ item }}"
    mode: "0660"
    force: false
  loop:
    - settings.yaml
    - bookmarks.yaml
    - widgets.yaml
    - docker.yaml
    - kubernetes.yaml
    - proxmox.yaml
    - custom.css
    - custom.js

- name: Stack directory
  ansible.builtin.file:
    path: "{{ homepage_stack_dir }}"
    state: directory
    mode: "0755"

- name: Copy the Helm chart to the container
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../kubernetes/charts/homepage/"
    dest: "{{ homepage_stack_dir }}/chart/"

- name: Render values (contains credentials)
  ansible.builtin.template:
    src: values-homelab.yaml.j2
    dest: "{{ homepage_stack_dir }}/values.yaml"
    mode: "0600"
  no_log: true

# helm upgrade --install is idempotent; k8s reconciles the rest. Change
# reporting is delegated to helm's own release history.
- name: Deploy the homepage release
  ansible.builtin.command:
    cmd: >-
      helm upgrade --install homepage {{ homepage_stack_dir }}/chart
      -f {{ homepage_stack_dir }}/values.yaml
      --namespace homepage --create-namespace
      --wait --timeout 5m
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

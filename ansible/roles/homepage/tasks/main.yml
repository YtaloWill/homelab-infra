---
- name: Check the share is available
  ansible.builtin.stat:
    path: "{{ configs_root }}/homepage"
  register: hp_share

- name: Abort when the share is not mounted
  ansible.builtin.assert:
    that: hp_share.stat.exists
    fail_msg: >-
      {{ configs_root }}/homepage missing — run storage.yml first
      (samba + host CIFS mount), then restart this container.

- name: Check whether settings.yaml already exists
  ansible.builtin.stat:
    path: "{{ configs_root }}/homepage/settings.yaml"
  register: hp_settings

# Homepage's own first-run behaviour is to copy a skeleton settings.yaml
# into place if missing — that copy tries to set file metadata CIFS won't
# allow (same class of failure as the chown warning below), and it isn't
# tolerated: EPERM there crashes the container. Seeding it ourselves (as
# root, which the CIFS mount's uid mapping already permits) means Homepage
# finds it already present and never attempts that copy. Only writes when
# absent, so it won't clobber settings changed later via Homepage's own UI.
- name: Seed settings.yaml
  ansible.builtin.template:
    src: settings.yaml.j2
    dest: "{{ configs_root }}/homepage/settings.yaml"
    mode: "0660"
  when: not hp_settings.stat.exists

- name: Stack directory
  ansible.builtin.file:
    path: "{{ homepage_stack_dir }}"
    state: directory
    mode: "0755"

- name: Copy the Helm chart to the container
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../kubernetes/charts/homepage/"
    dest: "{{ homepage_stack_dir }}/chart/"

- name: Render values (contains credentials)
  ansible.builtin.template:
    src: values-homelab.yaml.j2
    dest: "{{ homepage_stack_dir }}/values.yaml"
    mode: "0600"
  no_log: true

# helm upgrade --install is idempotent; k8s reconciles the rest. Change
# reporting is delegated to helm's own release history.
- name: Deploy the homepage release
  ansible.builtin.command:
    cmd: >-
      helm upgrade --install homepage {{ homepage_stack_dir }}/chart
      -f {{ homepage_stack_dir }}/values.yaml
      --namespace homepage --create-namespace
      --wait --timeout 5m
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

---
- name: Check the hdd-80 bind mount is available
  ansible.builtin.stat:
    path: "{{ databases_export_path }}"
  register: hdd80_bind

- name: Abort when hdd-80 is not mounted
  ansible.builtin.assert:
    that: hdd80_bind.stat.exists
    fail_msg: >-
      {{ databases_export_path }} missing — hdd-80 must be bind-mounted by
      tofu before this role runs (mount_point in tofu/databases.tf).

- name: Install the CloudNativePG operator
  ansible.builtin.command: >-
    k3s kubectl apply --server-side -f
    https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release-1.29/releases/cnpg-{{ cnpg_version }}.yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Wait for the CloudNativePG operator to roll out
  ansible.builtin.command: >-
    k3s kubectl rollout status deployment -n cnpg-system
    cnpg-controller-manager --timeout=180s
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Stack directory
  ansible.builtin.file:
    path: "{{ databases_stack_dir }}"
    state: directory
    mode: "0755"

- name: Render the Postgres data PersistentVolume
  ansible.builtin.template:
    src: postgres-pv.yaml.j2
    dest: "{{ databases_stack_dir }}/postgres-pv.yaml"
    mode: "0644"

- name: Apply the Postgres data PersistentVolume
  ansible.builtin.command: >-
    k3s kubectl apply -f {{ databases_stack_dir }}/postgres-pv.yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Render the BookOrbit Postgres Cluster manifest (contains credentials)
  ansible.builtin.template:
    src: bookorbit-cluster.yaml.j2
    dest: "{{ databases_stack_dir }}/bookorbit-cluster.yaml"
    mode: "0600"
  no_log: true

- name: Apply the BookOrbit Postgres Cluster
  ansible.builtin.command: >-
    k3s kubectl apply -f {{ databases_stack_dir }}/bookorbit-cluster.yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Wait for the BookOrbit Postgres cluster to be ready
  ansible.builtin.command: >-
    k3s kubectl wait cluster/bookorbit-postgres -n databases
    --for=condition=Ready --timeout=300s
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

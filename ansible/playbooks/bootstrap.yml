---
# First-contact bootstrap: Alpine LXC templates ship without sshd/python, so
# Ansible cannot reach the containers directly yet. This playbook runs on the
# PVE host and prepares each container via `pct exec`. The whole fleet is
# Alpine (design decision 10), so this is a single code path.
- name: Bootstrap python + sshd + operator key inside the LXC containers
  hosts: proxmox
  gather_facts: false
  vars:
    ssh_public_key_file: "{{ lookup('env', 'HOME') }}/.ssh/id_ed25519.pub"
    ssh_public_key: "{{ lookup('file', ssh_public_key_file) }}"
    bootstrap_containers: [100, 101, 104, 150]
  tasks:
    - name: Install python3 + sshd
      ansible.builtin.command: >-
        pct exec {{ item }} -- apk add --no-cache python3 openssh
      loop: "{{ bootstrap_containers }}"
      register: apk_result
      changed_when: "'Installing' in apk_result.stdout"

    - name: Enable sshd at boot
      ansible.builtin.command: >-
        pct exec {{ item }} -- rc-update add sshd default
      loop: "{{ bootstrap_containers }}"
      register: rcupdate_result
      changed_when: "'added to runlevel' in rcupdate_result.stdout"

    - name: Start sshd if not running
      ansible.builtin.command: >-
        pct exec {{ item }} -- sh -c
        "rc-service sshd status >/dev/null 2>&1 || rc-service sshd start"
      loop: "{{ bootstrap_containers }}"
      changed_when: false

    - name: Install the operator public key for root
      ansible.builtin.command: >-
        pct exec {{ item }} -- sh -c
        "mkdir -p /root/.ssh && chmod 700 /root/.ssh &&
        if ! grep -qxF '{{ ssh_public_key }}' /root/.ssh/authorized_keys 2>/dev/null; then
        echo '{{ ssh_public_key }}' >> /root/.ssh/authorized_keys && chmod 600 /root/.ssh/authorized_keys && echo ADDED; fi"
      loop: "{{ bootstrap_containers }}"
      register: key_result
      changed_when: "'ADDED' in key_result.stdout"

---
- name: Jellyfin media server (k3s + helm)
  hosts: jellyfin
  roles:
    - k3s
    - jellyfin

- name: arr media automation stack (k3s + helm)
  hosts: arr
  roles:
    - k3s
    - arr_stack

- name: Database tier (k3s + CloudNativePG)
  hosts: databases
  roles:
    - k3s
    - databases

- name: BookOrbit ebook/audiobook library server (k3s + helm)
  hosts: bookorbit
  roles:
    - k3s
    - bookorbit

- name: Homepage service dashboard (k3s + helm)
  hosts: homepage
  roles:
    - k3s
    - homepage

- name: Local DNS + reverse proxy
  hosts: traefik
  roles:
    - proxy

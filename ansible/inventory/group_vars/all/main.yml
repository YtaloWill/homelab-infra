---
tz: America/Sao_Paulo

# gid 10000 in-container == gid 110000 on the PVE host (unprivileged offset);
# the host CIFS mount maps everything to that gid — see design decision 1.
puid: 1000
pgid: 10000

# --- hdd-500 (physical disk backing the samba export) ---------------------
# sdX device letters shift across a physical disconnect/reconnect; the
# filesystem UUID is the only stable way to find it again (see
# recover-nas-mount.yml). Get it with `blkid /dev/sdX1` on the PVE host.
hdd500_uuid: 932511de-e45b-4035-bacf-0fe88fd30bcb
hdd500_mount_path: /mnt/pve/hdd-500

# --- hdd-80 (physical disk backing the databases container) ---------------
# Same reconnect story as hdd-500 (see recover-hdd80-mount.yml)
hdd80_uuid: 1ab3d626-589d-4895-aef3-924bf3ff4363
hdd80_mount_path: /mnt/pve/hdd-80

# --- samba / storage ------------------------------------------------------
samba_host: 192.168.15.150
samba_share: nas
samba_user: sambauser
samba_password: "{{ vault_samba_password }}"
samba_export_path: /srv/nas

host_cifs_mount: /mnt/samba
# nobrl: SQLite DBs live on the share (design decision 2).
cifs_mount_opts: "credentials=/etc/samba/credentials,vers=3.0,uid=100000,gid=110000,file_mode=0660,dir_mode=0770,nofail,_netdev,nobrl"

configs_root: /mnt/samba/configs
media_root: /mnt/samba/media

media_dirs:
  - downloads
  - movies
  - shows
  - test_movies
  - test_shows
  - books
  - books/Ebooks
  - books/Audiobooks
  - books/Comics

arr_services:
  - prowlarr
  - qbittorrent
  - radarr
  - sonarr
  - bazarr
  - jellyseerr
  - configarr

# --- arr stack (k3s + helm) -------------------------------------------------
# Chart copy + rendered values live under /srv (existing convention on
# PCT 101); the legacy compose file sits at /srv/docker-compose.yml and is
# left untouched. App wiring: kubernetes/charts/arr-stack/values.yaml.
arr_stack_dir: /srv/arr

# --- jellyfin (k3s + helm) ---------------------------------------------------
# Same chart-copy convention as arr_stack_dir. App wiring:
# kubernetes/charts/jellyfin/values.yaml.
jellyfin_stack_dir: /srv/jellyfin

# --- bookorbit (k3s + helm) --------------------------------------------------
# Same chart-copy convention as arr_stack_dir/jellyfin_stack_dir. App
# wiring: kubernetes/charts/bookorbit/values.yaml.
bookorbit_stack_dir: /srv/bookorbit
bookorbit_db_host: 192.168.15.151

# --- databases (k3s + CloudNativePG) -----------------------------------------
# hdd-80 bind-mounted directly into the container (no CIFS — Postgres data
# doesn't tolerate network-filesystem locking, see design decision 12).
# Rendered manifests (PV + CNPG Cluster) live under databases_stack_dir.
databases_export_path: /srv/data
databases_stack_dir: /srv/databases
cnpg_version: "1.29.2"

# Independent VPN egress (helm value gluetun.enabled). Enabling requires valid
# credentials in vault (vault_gluetun_environment); no other workload is
# affected either way — apps opt in via their own proxy settings, pointed at
# http://192.168.15.103:8888 (design decision 5).
gluetun_enabled: false

# Configarr sync (helm value configarr.enabled) — a one-shot Job that runs
# automatically the first time it's deployed. Requires
# vault_configarr_environment (sonarr/radarr API keys); independent of every
# other workload — it only reads from the sonarr/radarr Services already
# created by arr_stack. Bump configarr_sync_trigger to a new value and
# re-run the playbook to trigger a resync.
configarr_enabled: true
configarr_sync_trigger: "1"

# --- proxy / DNS ----------------------------------------------------------
proxy_ip: 192.168.15.104
local_domain: local # switch to lan/home.arpa if mDNS collisions bite
upstream_dns:
  - 192.168.15.1
  - 1.1.1.1

traefik_version: "v3.4.1"

proxy_services:
  - name: jellyfin
    url: http://192.168.15.102:8096
  - name: bookorbit
    url: http://192.168.15.105:3000
  - name: prowlarr
    url: http://192.168.15.103:9696
  - name: qbittorrent
    url: http://192.168.15.103:8080
  - name: radarr
    url: http://192.168.15.103:7878
  - name: sonarr
    url: http://192.168.15.103:8989
  - name: bazarr
    url: http://192.168.15.103:6767
  - name: jellyseerr
    url: http://192.168.15.103:5055
  - name: flaresolverr
    url: http://192.168.15.103:8191
  - name: proxmox
    url: https://192.168.15.101:8006
    insecure_backend: true
